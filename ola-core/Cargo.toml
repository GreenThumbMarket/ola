[package]
name = "ola-core"
version = "0.1.0"
edition = "2021"

[dependencies]
# Serde for serialization/deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Reqwest for HTTP requests
reqwest = { version = "0.11", features = ["json", "blocking", "stream"] }

# Tokio for async runtime
tokio = { version = "1", features = ["full"] }

# Async trait support
async-trait = "0.1"

# Anyhow for error handling
anyhow = "1.0"

# Logging
log = "0.4"
chrono = { version = "0.4.39", features = ["serde"] }

# UUID generation
uuid = { version = "1.0", features = ["v4"] }

# Base64 encoding for binary files
base64 = "0.21"

# Regex for pattern matching
regex = "1"

# Dialoguer for user-friendly prompts
dialoguer = "0.10"

# Terminal utilities
atty = "0.2"
indicatif = "0.17"
termcolor = "1.4"
console = "0.15"

# RAG dependencies
# PDF processing
pdf-extract = "0.7"

# Embeddings and ML
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
tokenizers = "0.20"
hf-hub = "0.3"

# Vector store
hnsw = "0.11"
chromadb = "0.2"  # ChromaDB client for vector database

# Additional utilities for RAG
rayon = "1.10"  # Parallel processing
bincode = "1.3"  # Binary serialization for vectors
ndarray = "0.15"  # N-dimensional arrays
